[ids]
*

[main]
# 將 CapsLock 改為複合鍵：短按為 Esc，長按切換至 fn 圖層
capslock = overload(fn, esc)

[fn]
# WASD 方向鍵
w = up
a = left
s = down
d = right

# HJKL 方向鍵 (Vim 風格)
h = left
j = down
k = up
l = right

# 常用延伸按鍵 (可依習慣自行調整)
i = insert
p = print
delete = backspace

[shift]
# Shift+Space 只送普通空白，避免誤觸 chewing 的全形/半形切換
space = space

[control+alt]
# Ctrl+Alt+Space 改成送 Shift+Space 給 fcitx5-chewing，當作新的全形/半形切換
space = S-space

[meta+shift]
# [shift] 的 space = space 會把 Shift 放掉，導致 Hyprland 收不到 SUPER+SHIFT+Space（浮動切換）
# 同時按住 Meta+Shift 時改走這個組合圖層，原樣送出 Meta+Shift+Space
space = M-S-space
