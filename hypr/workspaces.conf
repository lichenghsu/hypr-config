# Static monitor:<port> bindings are gone on purpose: external monitor port
# names change (HDMI-A-1 vs DP-1 vs DP-2 depending on cable/dock), so any
# hardcoded name here goes stale and workspace 6-10 stop binding to it,
# leaving Hyprland to invent an overflow workspace (e.g. 11) instead.
# hypr/lua/workspaces.lua rebinds 1-5 -> eDP-1 and 6-10 -> "whichever
# monitor isn't eDP-1" dynamically on monitor.added/removed. Keep only the
# workspace declarations here.
workspace=1,default:true
workspace=2
workspace=3
workspace=4
workspace=5
workspace=6,default:true
workspace=7
workspace=8
workspace=9
workspace=10
