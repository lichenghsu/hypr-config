# Caffeine mode = /run/user/1000/caffeine exists (toggled by quickshell).
# While on: idle lock uses swaylock, display stays on, no suspend.

general {
    lock_cmd = /home/miles/.local/bin/smart_lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dpms on
    ignore_dbus_inhibit = false
}

# 15 min: lock screen
listener {
    timeout = 900
    on-timeout = /home/miles/.local/bin/smart_lock.sh
}

# 20 min: turn off display (skipped in caffeine mode)
listener {
    timeout = 1200
    on-timeout = [ -e /run/user/1000/caffeine ] || hyprctl dpms off
    on-resume = hyprctl dpms on
}

# 60 min: suspend (skipped in caffeine mode)
listener {
    timeout = 3600
    on-timeout = [ -e /run/user/1000/caffeine ] || systemctl suspend
}
