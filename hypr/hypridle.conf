# Caffeine mode = /run/user/1000/caffeine exists (toggled by quickshell).
# While on: idle lock waits 30 min and uses hyprlock, display stays on, no suspend.

general {
    lock_cmd = /home/miles/.local/bin/smart_lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dpms on
    ignore_dbus_inhibit = false
}

# 5 min: lock screen (skipped in caffeine mode)
listener {
    timeout = 300
    on-timeout = [ -e /run/user/1000/caffeine ] || /home/miles/.local/bin/smart_lock.sh
}

# 30 min: lock screen in caffeine mode
listener {
    timeout = 1800
    on-timeout = [ ! -e /run/user/1000/caffeine ] || /home/miles/.local/bin/smart_lock.sh
}

# 10 min: turn off display (skipped in caffeine mode)
listener {
    timeout = 600
    on-timeout = [ -e /run/user/1000/caffeine ] || hyprctl dpms off
    on-resume = hyprctl dpms on
}

# 30 min: suspend (skipped in caffeine mode)
listener {
    timeout = 1800
    on-timeout = [ -e /run/user/1000/caffeine ] || systemctl suspend
}
