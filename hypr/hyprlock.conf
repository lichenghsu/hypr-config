################
### HYPRLOCK ###
################
# Caffeine-mode lock (via bin/smart_lock.sh): blurred screenshot + ring with clock inside (swaylock-effects look).

general {
    disable_loading_message = true
    hide_cursor = true
}

# Everything else (background, ring, clock, date) is generated per monitor by
# bin/smart_lock.sh right before hyprlock starts:
# - background: blurred greyscale screenshot (hyprlock can't desaturate)
# - widget sizes multiplied by the monitor scale (hyprlock sizes are physical px)
# Hardcoded path: hyprlang treats $VAR as its own variables.
source = /run/user/1000/hyprlock/monitors.conf
